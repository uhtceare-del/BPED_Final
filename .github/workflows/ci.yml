name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: models
            path: test/models
          - suite: services
            path: test/class_code_service_test.dart test/services
          - suite: config
            path: test/config
          - suite: providers
            path: test/providers
          - suite: widgets
            path: test/dashboard_analytics_test.dart test/widget_test.dart
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create test .env
        run: |
          cat > .env <<'EOF'
          ADMIN_EMAIL=admin.bped.dev@gmail.com
          SUPABASE_URL=
          SUPABASE_ANON_KEY=
          EMAILJS_SERVICE_ID=
          EMAILJS_TEMPLATE_ID=
          EMAILJS_PUBLIC_KEY=
          EOF

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run ${{ matrix.suite }} tests
        run: flutter test ${{ matrix.path }}

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create build .env
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
        run: |
          cat > .env <<EOF
          ADMIN_EMAIL=${ADMIN_EMAIL:-admin.bped.dev@gmail.com}
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          EMAILJS_SERVICE_ID=${EMAILJS_SERVICE_ID}
          EMAILJS_TEMPLATE_ID=${EMAILJS_TEMPLATE_ID}
          EMAILJS_PUBLIC_KEY=${EMAILJS_PUBLIC_KEY}
          EOF

      - name: Validate required runtime config
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "SUPABASE_URL secret is missing."
            exit 1
          fi

          if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "SUPABASE_ANON_KEY secret is missing."
            exit 1
          fi

          case "${{ secrets.SUPABASE_URL }}" in
            https://*)
              ;;
            *)
              echo "SUPABASE_URL must start with https://"
              exit 1
              ;;
          esac

      - name: Restore pub cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Web
        run: flutter build web --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-artifacts
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/web/
