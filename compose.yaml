services:
  admin-debug:
    profiles: ["debug"]
    build:
      context: .
      target: tooling
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - flutter_pub_cache:/root/.pub-cache
      - flutter_dart_tool:/app/.dart_tool
      - flutter_build:/app/build
    stdin_open: true
    tty: true
    command: >
      bash -lc "
      test -f .env || { echo 'Missing .env. Copy .env.example to .env before running compose.'; exit 1; } &&
      flutter pub get &&
      flutter run -d web-server
      --no-dds
      --web-hostname 0.0.0.0
      --web-port 8080
      "

  app-prod:
    profiles: ["prod"]
    build:
      context: .
      target: web-prod
    ports:
      - "8081:80"

volumes:
  flutter_pub_cache:
  flutter_dart_tool:
  flutter_build:
